name: superglue

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --features mcp,gateway
      - run: cargo test --features grpc --lib
      - name: Generate proto stubs
        run: |
          python3 -m venv .venv-proto
          .venv-proto/bin/pip install grpcio-tools --quiet
          bash scripts/generate-proto-clients.sh
      - name: Verify generated Python proto stubs are committed
        run: git diff --exit-code superglue-py/superglue/grpc/

  superglue-js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: superglue-js
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: superglue-js/package-lock.json
      - run: npm ci
      - run: npm run build:native:debug
      - run: npm run build:ts
