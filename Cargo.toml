[package]
name = "superglue"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Superglue library and CLI"

[features]
# Enables the tonic gRPC server in `src/grpc/`.
grpc = ["dep:tonic", "dep:tokio-stream"]
# Enables the Prometheus metrics exporter.
prometheus = ["dep:metrics-exporter-prometheus"]
# Enables the OTLP span exporter via tracing-opentelemetry.
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]
mcp = ["dep:rmcp"]

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"
# tonic-build is always available so build.rs can conditionally invoke it for the grpc feature.
tonic-build = "0.13"

[dependencies]
async-trait = "0.1"
prost = "0.13"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
governor = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-opentelemetry = { version = "0.29", optional = true }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", optional = true }
secrecy = { version = "0.8", features = ["alloc"] }
zeroize = "1"
tonic = { version = "0.13", optional = true }
tokio-stream = { version = "0.1", optional = true }
uuid = { version = "1", features = ["v4"] }
regex = "1.12.3"
opentelemetry = { version = "0.28", optional = true }
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.28", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"], optional = true }
rmcp = { version = "0.16", optional = true, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }

[[example]]
name = "28_mcp_tools"
path = "examples/28_mcp_tools.rs"
required-features = ["mcp"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6"
