[package]
name = "superglue"
version = "0.1.0"
edition = "2024"
description = "Superglue library and CLI"
license = "MIT"

[features]
# Enables `examples/chat_wiremock.rs` (local mock OpenAI); not needed for the library itself.
example-wiremock = ["dep:wiremock"]

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"

[dependencies]
async-trait = "0.1"
prost = "0.13"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
governor = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
wiremock = { version = "0.6", optional = true }
regex = "1.12.3"

[[example]]
name = "chat_wiremock"
required-features = ["example-wiremock"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6"
